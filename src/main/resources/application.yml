server:
  port: 8085
spring:
  application:
    name: twitter-clone-notifications-service
  jackson:
    default-property-inclusion: NON_NULL
  data:
    mongodb:
      uri: ${DB_HOST://localhost:27017/tc_notification_db}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:1234}
users-service:
  url: ${USER_URL:http://localhost:8080/users}
posts-service:
  url: ${POST_URL:http://localhost:8081/posts}
comments-service:
  url: ${COMMENT_URL:http://localhost:8082/comments}